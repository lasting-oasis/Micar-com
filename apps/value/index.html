        <h1 style="font-size: 2rem; line-height: 1.15; margin: 0 0 .5em">MiCar: your car, valued, recorded and graded</h1>
        <p>MiCar (said MEE-car) treats a car as an asset with a record. Type a car and see its trade-in, private-party and dealer retail value, with a price range and a five-year forecast. Park it in the Garage and it becomes a card with its own MiCar ID, a passport of its history, a grade from 1 to 10 and a collectible card. Drive it in MiCar World, a 3D town. Free, no account needed.</p>
        <p>Every fact about a car here is its owner's word: MiCar has checked no record, and nothing is independently verified yet. The app needs JavaScript; the pages below are plain HTML.</p>

        <p lang="es">En español: MiCar calcula gratis el valor de un auto usado, lo guarda en el Garaje con su MiCar ID, su pasaporte y su calificación, y lo lleva a MiCar World. Todo dato sobre un auto es la palabra de su dueño: MiCar no ha revisado ningún registro. <a style="color: #ffd23f" href="https://lasting-oasis.github.io/Micar-com/es/about/">Qué es MiCar</a> · <a style="color: #ffd23f" href="https://lasting-oasis.github.io/Micar-com/es/method/">Cómo se calcula un valor</a> · <a style="color: #ffd23f" href="https://lasting-oasis.github.io/Micar-com/es/cars/">Todos los autos</a></p>
