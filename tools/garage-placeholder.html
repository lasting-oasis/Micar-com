<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MiCar Garage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* css */
body{margin:0;background:#0e1217;color:#e7eaee;font:18px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:grid;place-items:center;text-align:center;padding:24px 16px}
main p{margin:0}
b{color:#ffd23f}
main a{color:#e7eaee;text-decoration:underline;text-underline-offset:4px;display:inline-block;padding:12px 8px}
</style>
</head>
<body>
<main><p><b>MiCar Garage</b><br>Park it. Grade it. Trade it.<br><a href="../#/garage">Open the Garage</a></p></main>
<script>
// /garage/ is the Garage's old address. The Garage now lives in the app at #/garage: forward there, keeping any
// query (?lang=es), without a history entry. Without scripts the link above does the same.
(function () {
  var base = location.pathname.replace(/garage\/?[^/]*$/, '');
  location.replace(location.origin + base + location.search + '#/garage');
})();
</script>
<!-- footer -->
</body>
</html>
