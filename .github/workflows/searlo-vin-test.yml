name: Searlo VIN test

# A one-off, measured test of Searlo's VIN tools (scripts/searlo_vin_test.py) for the feedback we send them.
# Shares the listings job's concurrency group, so it waits for a running fill and its credit counts stay clean.
# Writes totals only (data/searlo/vin-test.json): no VIN is ever saved or printed.
on:
  push:
    branches: [searlo-listings]
    paths: [.github/workflows/searlo-vin-test.yml, apps/value/scripts/searlo_vin_test.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: searlo-listings
  cancel-in-progress: false

jobs:
  vin-test:
    defaults:
      run:
        working-directory: apps/value
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/searlo_vin_test.py
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/searlo/vin-test.json
          git commit -m "Searlo VIN test $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
