name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @micar/value test
      - run: pnpm --filter @micar/sim test
      - run: pnpm -r --if-present build
      # the Strip smoke test: the production server with SMOKE=1 (a new player is given a starter car), a software-GL Chromium, no display
      - run: pnpm --filter @micar/sim exec playwright install --with-deps chromium
      - name: Strip smoke test
        working-directory: apps/sim
        env:
          PORT: 3123
          NODE_ENV: production
          SMOKE: '1'
        run: |
          # a throwaway tester key, made here and gone with the job: the smoke's tester run needs the server to have one
          export TESTER_KEY="smoke-$(openssl rand -hex 12)"
          pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3123/ > /dev/null && break; sleep 1; done
          status=0
          BASE=http://localhost:3123/ node e2e/strip.smoke.mjs || status=$?
          # the engine sound model, rendered through the built audio worklet
          BASE=http://localhost:3123/ node e2e/sound.smoke.mjs || status=$?
          # a challenge race: one link, two browsers, the same quarter mile at the same moment
          BASE=http://localhost:3123/ node e2e/challenge.smoke.mjs || status=$?
          if [ "$status" != 0 ]; then echo "--- server log"; tail -50 "$RUNNER_TEMP/server.log"; fi
          exit $status
